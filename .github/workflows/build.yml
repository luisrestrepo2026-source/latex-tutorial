name: Build LaTeX

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile three PDF entrypoints
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Compile with XeLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            main.tex
            beamer-demo.tex
            example.tex
          texlive_version: 2025
          os: debian
          latexmk_use_xelatex: true
          args: -synctex=1 -interaction=nonstopmode -file-line-error -halt-on-error -outdir=build

      - name: Upload compiled PDFs
        uses: actions/upload-artifact@v7
        with:
          name: latex-pdfs
          path: |
            build/main.pdf
            build/beamer-demo.pdf
            build/example.pdf
          if-no-files-found: error
